; ========================================================
; MAAT Monitor - Monitoramento de processos judiciais
; Arquivo de configuracao
; ========================================================
; Copie este arquivo para config.ini e edite os valores.
; NAO use aspas. NAO apague os colchetes [secao].

[advogado]
; Numero da sua OAB (somente digitos, sem pontos)
oab_numero = 000000
; UF da OAB
oab_uf = SP
; Seu nome (aparece nos relatorios)
nome = Dra. Fulana de Tal

[tribunais]
; Tribunais para monitorar (separados por virgula)
; Exemplos de codigos disponiveis:
;   tjsp  = TJ Sao Paulo (estadual)
;   tjrj  = TJ Rio de Janeiro
;   tjmg  = TJ Minas Gerais
;   trf3  = TRF 3a Regiao (federal SP/MS)
;   trt2  = TRT 2a Regiao (trabalho SP)
;   stj   = Superior Tribunal de Justica
;   stf   = Supremo Tribunal Federal
;   tst   = Tribunal Superior do Trabalho
; Todos os tribunais do DataJud sao aceitos: tj<uf>, trf1..trf6,
; trt1..trt24, tre-<uf>, tjmsp/tjmmg/tjmrs, stf, stj, tst, tse, stm.
; O tribunal de cada processo e identificado automaticamente pelo numero CNJ;
; esta lista serve apenas como referencia nos relatorios.
ativos = tjsp, trf3, trt2

[notificacoes]
; -------------------------------------------------------
; EMAIL
; -------------------------------------------------------
; Para ativar: coloque email_ativo = sim
; e preencha os campos abaixo.
;
; Como obter a senha de aplicativo do Gmail:
;   1. Acesse https://myaccount.google.com/security
;   2. Ative "Verificacao em duas etapas"
;   3. Acesse https://myaccount.google.com/apppasswords
;   4. Crie uma senha chamada "MAAT" (16 caracteres)
;   5. Cole aqui em email_senha_app
; -------------------------------------------------------
email_ativo = nao
email_smtp = smtp.gmail.com
email_porta = 587
email_remetente =
email_senha_app =
email_destinatario =

; -------------------------------------------------------
; WHATSAPP (via CallMeBot — gratuito)
; -------------------------------------------------------
; Para ativar:
;   1. Salve o numero +34 644 59 97 45 na sua agenda
;   2. Envie pelo WhatsApp para esse numero a mensagem:
;      I allow callmebot to send me messages
;   3. Aguarde a resposta com seu token (ex: 1234567)
;   4. Preencha whatsapp_telefone com seu numero
;      no formato internacional sem + (ex: 5511999999999)
;   5. Cole o token recebido em whatsapp_token
;   6. Mude whatsapp_ativo para sim
; Obs: so envia mensagem quando houver novos andamentos.
; -------------------------------------------------------
whatsapp_ativo = nao
whatsapp_telefone =
whatsapp_token =

[execucao]
; Quantos dias sem atualizacao ate considerar processo "parado"
dias_alerta_parado = 30
; Tempo entre requisicoes ao DataJud (segundos) - evita rate limit
delay_segundos = 1.5
